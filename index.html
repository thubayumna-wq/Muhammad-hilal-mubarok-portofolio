<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Birthday 19</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Plus Jakarta Sans',sans-serif;

background:
linear-gradient(
to bottom,
#020617 0%,
#0f172a 40%,
#111827 100%
);

color:var(--text);

overflow-x:hidden;

position:relative;

}

canvas{
position:absolute;
top:0;
left:0;
}

#count{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

font-size:180px;

color:white;

opacity:0;

z-index:20;

text-shadow:
0 0 30px white,
0 0 60px hotpink;

transition:1s;

}

#birthday{

position:absolute;

top:15%;

width:100%;

text-align:center;

font-size:70px;

font-weight:bold;

opacity:0;

z-index:20;

color:white;

text-shadow:
0 0 20px hotpink,
0 0 50px deeppink;

transition:2s;

}

#cake{

position:absolute;

left:50%;

bottom:80px;

transform:
translateX(-50%);

opacity:0;

z-index:30;

}

/* SUSUNAN KUE */

.layer{

position:absolute;

left:50%;

transform:
translateX(-50%)
translateY(-300px);

opacity:0;

transition:1s;

border-radius:25px;

box-shadow:
0 0 25px pink;

}

.layer1{

width:280px;
height:90px;

bottom:0;

background:
linear-gradient(
to bottom,
#ffe4e1,
#ffb6c1
);

}

.layer2{

width:220px;
height:75px;

bottom:75px;

background:
linear-gradient(
to bottom,
#fff0f5,
#ffc0cb
);

}

.layer3{

width:150px;
height:60px;

bottom:140px;

background:
linear-gradient(
to bottom,
white,
#ffd1dc
);

}

.candle{

position:absolute;

width:28px;

height:90px;

background:red;

top:-95px;

display:flex;

justify-content:center;

align-items:center;

font-size:35px;

font-weight:bold;

color:white;

border-radius:10px;

box-shadow:
0 0 20px red;

}

.c1{
left:40px;
}

.c2{
right:40px;
}

.fire{

position:absolute;

top:-22px;

width:18px;
height:28px;

background:
radial-gradient(
yellow,
orange
);

border-radius:50%;

animation:
flame .3s infinite alternate;

box-shadow:
0 0 30px gold;

}

@keyframes flame{

from{
transform:
scale(.9);
}

to{
transform:
scale(1.2);
}

}

.firework{

position:absolute;

font-size:35px;

animation:
boom 2s linear forwards;

}

@keyframes boom{

0%{

opacity:1;

transform:
scale(.2);

}

100%{

opacity:0;

transform:
scale(3);

}

}

#closing{

position:absolute;

top:50%;

left:50%;

transform:
translate(-50%,-50%);

text-align:center;

opacity:0;

z-index:50;

transition:3s;

}

.line{

font-size:45px;

color:white;

margin:20px 0;

opacity:0;

transform:
translateY(40px);

transition:1.5s;

text-shadow:
0 0 20px hotpink,
0 0 40px deeppink;

}

/* ===== PEMANDANGAN MALAM ===== */

.landscape{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

z-index:-10;

overflow:hidden;

}

/* BULAN */

.moon{

position:absolute;

top:90px;
right:120px;

width:140px;
height:140px;

border-radius:50%;

background:
radial-gradient(
circle,
white,
#ddd
);

box-shadow:
0 0 80px white;

}

/* GUNUNG BELAKANG */

.mountain1{

position:absolute;

bottom:0;

width:100%;
height:320px;

background:#020617;

clip-path:
polygon(
0 100%,
10% 70%,
25% 85%,
40% 45%,
55% 80%,
70% 35%,
85% 75%,
100% 50%,
100% 100%
);

}

/* GUNUNG DEPAN */

.mountain2{

position:absolute;

bottom:0;

width:100%;
height:220px;

background:#111827;

clip-path:
polygon(
0 100%,
15% 60%,
35% 80%,
50% 40%,
70% 70%,
85% 50%,
100% 75%,
100% 100%
);

}

/* KABUT */

.fog{

position:absolute;

bottom:120px;

width:200%;

height:100px;

background:
rgba(255,255,255,.04);

filter:blur(40px);

animation:
fogMove 20s linear infinite;

}

@keyframes fogMove{

0%{
transform:translateX(0);
}

100%{
transform:translateX(-250px);
}

}



</style>
</head>

<body>

<div class="landscape">

<div class="moon"></div>

<div class="fog"></div>

<div class="mountain1"></div>

<div class="mountain2"></div>

</div>

<canvas id="matrix"></canvas>

<div id="count">3</div>

<div id="birthday">
HAPPY BIRTHDAY
</div>

<div id="cake">

<div class="layer layer1"></div>

<div class="layer layer2"></div>

<div class="layer layer3">

<div class="candle c1">

1

<div class="fire"></div>

</div>

<div class="candle c2">

9

<div class="fire"></div>

</div>

</div>

</div>

<div id="closing">

<div class="line">
Semoga Panjang Umur 🎂
</div>

<div class="line">
Di Lancarkan Rezekinya ✨
</div>

<div class="line">
Dan Dimudahkan Segala Urusannya 🤲
</div>

</div>

<script>

const canvas=
document.getElementById(
"matrix"
);

const ctx=
canvas.getContext(
"2d"
);

canvas.width=
innerWidth;

canvas.height=
innerHeight;

const chars=
"0101HAPPY19";

const size=18;

const cols=
canvas.width/size;

const drops=
Array(
Math.floor(cols)
).fill(1);

function matrix(){

ctx.fillStyle=
"rgba(0,0,0,.08)";

ctx.fillRect(
0,0,
canvas.width,
canvas.height
);

ctx.fillStyle=
"#ff1493";

ctx.font=
size+
"px monospace";

drops.forEach(
(d,i)=>{

let t=
chars[
Math.floor(
Math.random()*
chars.length
)
];

ctx.fillText(
t,
i*size,
d*size
);

if(
d*size>
canvas.height
&&
Math.random()>.98
){

drops[i]=0;

}

drops[i]++;

}
);

requestAnimationFrame(
matrix
);

}

matrix();

/* COUNTDOWN */

const counter=
document.getElementById(
"count"
);

["3","2","1"]

.forEach(
(n,i)=>{

setTimeout(()=>{

counter.innerHTML=n;

counter.style.opacity=1;

setTimeout(
()=>counter.style.opacity=0,
900
);

},
i*1200
);

}
);

/* HAPPY */

setTimeout(()=>{

document
.getElementById(
"birthday"
)

.style.opacity=1;

fireworks();

},4000);

/* KUE TERSUSUN */

setTimeout(()=>{

document
.getElementById(
"cake"
)

.style.opacity=1;

document
.querySelector(
".layer1"
)

.style.cssText+=
`
opacity:1;
transform:
translateX(-50%)
translateY(0);
`;

},6200);

setTimeout(()=>{

document
.querySelector(
".layer2"
)

.style.cssText+=
`
opacity:1;
transform:
translateX(-50%)
translateY(0);
`;

},7000);

setTimeout(()=>{

document
.querySelector(
".layer3"
)

.style.cssText+=
`
opacity:1;
transform:
translateX(-50%)
translateY(0);
`;

},7800);

function fireworks(){

setInterval(()=>{

let f=
document
.createElement(
"div"
);

f.className=
"firework";

f.innerHTML=
"🎆";

f.style.left=
Math.random()*100
+"%";

f.style.top=
Math.random()*60
+"%";

document.body
.appendChild(f);

setTimeout(
()=>f.remove(),
2000
);

},250);

}

setTimeout(()=>{

document
.getElementById(
"birthday"
)

.style.opacity=0;

document
.getElementById(
"cake"
)

.style.opacity=0;

document
.getElementById(
"closing"
)

.style.opacity=1;

let lines=
document
.querySelectorAll(
".line"
);

lines.forEach(
(line,i)=>{

setTimeout(()=>{

line.style.opacity=1;

line.style.transform=
"translateY(0)";

},i*1200);

}
);

},12000);

</script>

</body>
</html>
